<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>CIA Operations Center</title>
<style>
:root{--bg:#0c0c0e;--panel:#17171b;--line:#2a2a31;--tx:#ececf0;--mu:#8d8d99;--red:#e11d2e;--ok:#22c55e;--warn:#f59e0b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(1200px 500px at 80% -10%,#3a0a10 0,transparent 60%),var(--bg);background-attachment:fixed;color:var(--tx);font:14px/1.5 system-ui,Segoe UI,Tahoma,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}.side{width:220px;background:#111114;border-inline-end:1px solid var(--line);padding:14px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;gap:10px;align-items:center;margin-bottom:18px;font-weight:700;letter-spacing:.5px}.logo b{display:grid;place-items:center;width:38px;height:38px;background:linear-gradient(135deg,#ff2d3f,#8f0b17);border-radius:8px;font-size:12px;box-shadow:0 0 18px #e11d2e66}
.nav a{display:block;padding:9px 12px;border-radius:8px;color:var(--mu);cursor:pointer;margin-bottom:2px;transition:.15s}.nav a:hover{background:#1d1d22;color:var(--tx)}.nav a.on{background:var(--red);color:#fff}
main{flex:1;padding:20px;min-width:0;animation:in .25s}@keyframes in{from{opacity:0;transform:translateY(6px)}}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}h1{margin:0;font-size:22px}h3{margin:0 0 10px}
.card{background:linear-gradient(180deg,#1b1b20,#141418);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 4px 18px #0006;transition:.2s}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.stat{font-size:34px;font-weight:800;color:#fff;text-shadow:0 0 18px #e11d2e55}.mu{color:var(--mu)}
.btn{background:var(--red);border:0;border-radius:8px;padding:7px 12px;cursor:pointer;color:#fff}.btn.g{background:#26262d}.btn.s{padding:3px 8px;font-size:12px}.btn:hover{filter:brightness(1.15)}
input,select,textarea{background:#0f0f12;border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar>*{width:auto;flex:1;min-width:130px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px 10px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mu);font-weight:600;cursor:pointer}tr:hover td{background:#1b1b20}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;background:#26262d}.Active,.High{color:var(--ok)}.Suspended,.Urgent{color:var(--red)}.OnLeave,.Normal{color:var(--warn)}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:9;padding:12px}.modal .card{width:min(460px,100%);max-height:90vh;overflow:auto}.modal label{display:block;margin:8px 0 3px;color:var(--mu)}
.tree ul{list-style:none;margin:0;padding-inline-start:22px;border-inline-start:1px dashed var(--line)}.tree li{margin:6px 0}.node{display:inline-block;background:#0f0f12;border:1px solid var(--line);border-inline-start:3px solid var(--red);border-radius:8px;padding:5px 10px}
.bars{display:flex;align-items:flex-end;gap:8px;height:140px}.bars div{flex:1;background:var(--red);border-radius:4px 4px 0 0;position:relative;min-height:3px}.bars span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--mu)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{min-height:68px;background:#0f0f12;border:1px solid var(--line);border-radius:6px;padding:3px;font-size:11px}.ev{background:var(--red);border-radius:4px;padding:1px 4px;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}.login .card{width:min(380px,100%)}.err{color:var(--red);margin:6px 0}.av{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#e11d2e,#5a0a12);font-size:11px;font-weight:700;margin-inline-end:8px;vertical-align:middle}.card:hover{border-color:#4a4a54}.nav a.on{box-shadow:0 0 14px #e11d2e66}.toast{position:fixed;bottom:16px;inset-inline-end:16px;background:#26262d;border-inline-start:3px solid var(--red);padding:10px 14px;border-radius:8px;z-index:20}
@media(max-width:760px){.app{flex-direction:column}.side{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.nav{display:flex;flex-wrap:wrap;gap:2px;width:100%}.logo{margin:0}.nav a{padding:6px 9px;font-size:13px}}
</style></head><body><div id="root"></div>
<script>
const AR={Dashboard:'لوحة التحكم',Members:'الأعضاء',Hierarchy:'الهيكل التنظيمي',Ranks:'الرتب',Units:'الوحدات',Calendar:'التخطيط',Reports:'التقارير',Announcements:'الإعلانات',Admin:'الإدارة',Logout:'خروج',Add:'إضافة',Edit:'تعديل',Save:'حفظ',Cancel:'إلغاء',Search:'بحث',Name:'الاسم',Rank:'الرتبة',Unit:'الوحدة',Status:'الحالة',Callsign:'الاسم الرمزي',Attendance:'الحضور','Total Members':'إجمالي الأعضاء','Active Members':'الأعضاء النشطون',Login:'دخول',Username:'اسم المستخدم',Password:'كلمة المرور','Export CSV':'تصدير CSV',Archive:'أرشفة',View:'عرض',Title:'العنوان',Date:'التاريخ',Time:'الوقت','Operations Center':'مركز العمليات','No results':'لا توجد نتائج',Leadership:'القيادة',Activity:'النشاط','Upcoming training':'التدريبات القادمة','Recent admin updates':'آخر التحديثات','Audit log':'سجل التدقيق',Roles:'الصلاحيات',Data:'البيانات'};
let lang=localStorage.fbiL||'en';const t=k=>lang=='ar'&&AR[k]||k;
const KEY='fbi_v2';
const ranks0=[['Commander','CMD',5],['Deputy Commander','DCMD',4],['Unit Leader','UL',3],['Operator','OP',2],['Recruit','RCT',1]].map((r,i)=>({id:'R'+i,name:r[0],abbr:r[1],level:r[2],req:['—','90 days as UL','60 days + evaluation','30 days + training','Pass interview'][i],perms:['All','All except system','Manage unit','Operate','View'][i],icon:'★'.repeat(r[2])}));
const nm=['Marcus Cole','Dana Reyes','Victor Hale','Nora Quinn','Ethan Brooks','Lena Ortiz','Jack Mercer','Sofia Marin','Owen Park','Ivy Lang','Leo Grant','Maya Stone'];
const mem0=nm.map((n,i)=>({id:'F-'+(100+i),name:n,call:(['Alpha','Bravo','Charlie'][i%3])+'-'+(i+1),rank:i==0?'Commander':i==1?'Deputy Commander':i<5?'Unit Leader':i<10?'Operator':'Recruit',unit:i<2?'Command':['Alpha','Bravo','Charlie'][i%3],status:i==7?'On Leave':i==11?'Suspended':'Active',att:60+(i*7)%40,last:'2026-10-'+String(1+i).padStart(2,'0'),quals:'Breaching, Tactical Medic',promos:'Joined 2026-01',arch:false,boss:i<2?(i?'F-100':''):'F-101'}));
const def=()=>({members:[],ranks:ranks0,units:['Alpha','Bravo','Charlie'].map((n,i)=>({id:n,name:n,desig:'Unit '+(i+1),leader:'',dep:'',train:'Pending',ann:'',notes:'',act:0})),events:[],anns:[],log:[],chart:[0,0,0,0,0,0]});
let S=JSON.parse(localStorage[KEY]||'null')||def(),U=JSON.parse(sessionStorage.fbiU||'null'),page='Dashboard',F={q:'',unit:'',rank:'',st:'',sort:'id',dir:1},cur=new Date(2026,9,1),calv='cal',pid=null;
const save=()=>localStorage[KEY]=JSON.stringify(S);
const log=a=>{S.log.unshift({d:new Date().toISOString().slice(0,16).replace('T',' '),u:U.u,a});save();if(!/^Log(in|out)$/.test(a))toast(lang=='ar'?'تم ✓':'✓ '+a)};
const can=l=>({admin:4,commander:3,officer:2,member:1}[U.role]>=l);
const USERS={admin:['admin123','admin'],commander:['cmd123','commander'],officer:['off123','officer'],member:['mem123','member']};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),2200)}
function mName(id){const m=S.members.find(x=>x.id==id);return m?m.name:'—'}
function modal(title,fields,vals,ok){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card"><h3>${t(title)}</h3><form>${fields.map(f=>`<label>${t(f[1])}</label>${f[2]=='select'?`<select name="${f[0]}">${f[3].map(o=>`<option ${o==vals[f[0]]?'selected':''}>${esc(o)}</option>`).join('')}</select>`:f[2]=='area'?`<textarea name="${f[0]}" rows="3">${esc(vals[f[0]])}</textarea>`:`<input name="${f[0]}" type="${f[2]||'text'}" value="${esc(vals[f[0]])}">`}`).join('')}<div class="err"></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn">${t('Save')}</button><button type="button" class="btn g">${t('Cancel')}</button></div></form></div>`;
document.body.append(m);const fm=m.querySelector('form');m.querySelector('.g').onclick=()=>m.remove();
fm.onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(fm));for(const f of fields)if(f[4]&&!String(o[f[0]]).trim()){m.querySelector('.err').textContent=f[1]+' is required';return}if(ok(o)!==false)m.remove()}}
function confirmD(msg,fn){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card"><p>${esc(msg)}</p><button class="btn">OK</button> <button class="btn g">${t('Cancel')}</button></div>`;document.body.append(m);m.querySelector('.g').onclick=()=>m.remove();m.querySelector('.btn').onclick=()=>{m.remove();fn()}}
function csv(name,rows){const c=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+c],{type:'text/csv'}));a.download=name;a.click();log('Exported '+name)}
const bars=(vals,labs)=>{const mx=Math.max(...vals,1);return `<div class="bars" style="margin-bottom:22px">${vals.map((v,i)=>`<div style="height:${v/mx*100}%" title="${v}"><span>${labs[i]}</span></div>`).join('')}</div>`};
const months=['May','Jun','Jul','Aug','Sep','Oct'];
const NAV=['Dashboard','Members','Hierarchy','Ranks','Units','Calendar','Reports','Announcements','Admin'];

function render(){document.documentElement.dir=lang=='ar'?'rtl':'ltr';document.documentElement.lang=lang;
if(!U){$('#root').innerHTML=`<div class="login"><form class="card" id="lf"><div class="logo"><b>CIA</b><span>Operations Center</span></div><label>${t('Username')}</label><input name="u" autocomplete="username"><label style="margin-top:8px;display:block">${t('Password')}</label><input name="p" type="password"><div class="err" id="le"></div><button class="btn" style="width:100%">${t('Login')}</button><p class="mu" style="font-size:12px">Demo: admin/admin123 · commander/cmd123 · officer/off123 · member/mem123</p><button type="button" class="btn g s" id="lg">EN / عربي</button></form></div>`;
$('#lg').onclick=()=>{lang=lang=='en'?'ar':'en';localStorage.fbiL=lang;render()};
$('#lf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),u=String(f.get('u')).trim().toLowerCase(),r=USERS[u];if(!r||r[0]!=f.get('p')){$('#le').textContent='Invalid credentials';return}U={u,role:r[1]};sessionStorage.fbiU=JSON.stringify(U);log('Login');render()};return}
$('#root').innerHTML=`<div class="app"><aside class="side"><div class="logo"><b>CIA</b><span>${t('Operations Center')}</span></div><nav class="nav">${NAV.filter(n=>n!='Admin'||can(4)).map(n=>`<a class="${n==page?'on':''}" data-p="${n}">${t(n)}</a>`).join('')}</nav></aside><main><div class="top"><span class="mu">${esc(U.u)} · ${U.role}</span><span><button class="btn g s" id="lg">EN / عربي</button> <button class="btn g s" id="lo">${t('Logout')}</button></span></div><div id="pg"></div></main></div>`;
document.querySelectorAll('[data-p]').forEach(a=>a.onclick=()=>{page=a.dataset.p;pid=null;render()});
$('#lg').onclick=()=>{lang=lang=='en'?'ar':'en';localStorage.fbiL=lang;render()};
$('#lo').onclick=()=>{log('Logout');U=null;sessionStorage.removeItem('fbiU');render()};
$('#pg').innerHTML=P[page]();if(AFT[page])AFT[page]()}

const live=()=>S.members.filter(m=>!m.arch);
const P={
Dashboard(){const L=live(),a=L.filter(m=>m.status=='Active'),up=[...S.events].sort((x,y)=>x.date.localeCompare(y.date)).slice(0,4);
return `<h1>${t('Dashboard')}</h1>${live().length?'':'<div class="card" style="margin:12px 0;border-color:var(--red)">👋 '+(lang=='ar'?'ابدأ بإضافة أول عضو من صفحة الأعضاء':'Get started: add your first member from the Members page')+'</div>'}<br><div class="grid"><div class="card"><div class="mu">${t('Total Members')}</div><div class="stat">${L.length}</div></div><div class="card"><div class="mu">${t('Active Members')}</div><div class="stat">${a.length}</div></div><div class="card"><div class="mu">${t('Units')}</div><div class="stat">${S.units.length}</div></div><div class="card"><div class="mu">Avg ${t('Attendance')}</div><div class="stat">${Math.round(L.reduce((s,m)=>s+m.att,0)/(L.length||1))}%</div></div></div>
<div class="grid g2"><div class="card"><h3>${t('Leadership')}</h3>${L.filter(m=>m.rank=='Commander'||m.rank=='Deputy Commander').map(m=>`<p>${esc(m.name)} <span class="tag">${m.rank}</span></p>`).join('')||t('No results')}</div><div class="card"><h3>${t('Activity')}</h3>${bars(S.chart,months)}</div>
<div class="card"><h3>${t('Upcoming training')}</h3>${up.map(e=>`<p>${esc(e.title)} <span class="mu">${e.date} ${e.time}</span></p>`).join('')}</div><div class="card"><h3>${t('Announcements')}</h3>${S.anns.filter(a=>!a.arch).map(a=>`<p>${a.pin?'📌 ':''}<b>${esc(a.title)}</b> <span class="tag ${a.pri}">${a.pri}</span></p>`).join('')||t('No results')}</div>
<div class="card"><h3>${t('Recent admin updates')}</h3>${S.log.slice(0,5).map(l=>`<p class="mu">${l.d} · ${esc(l.u)} · ${esc(l.a)}</p>`).join('')}</div></div>`},
Members(){if(pid){const m=S.members.find(x=>x.id==pid);return `<button class="btn g s" id="bk">←</button><h1>${esc(m.name)}</h1><div class="card"><p>ID: ${m.id} · ${esc(m.call)} · ${m.rank} · ${m.unit} · <span class="${m.status.replace(' ','')}">${m.status}</span></p><p>${t('Attendance')}: ${m.att}%</p><p><b>Qualifications:</b> ${esc(m.quals)}</p><p><b>Promotion history:</b> ${esc(m.promos)}</p><p class="mu">Last activity: ${m.last}</p></div>`}
let L=live().filter(m=>(!F.q||[m.name,m.id,m.call,m.rank].join(' ').toLowerCase().includes(F.q.toLowerCase()))&&(!F.unit||m.unit==F.unit)&&(!F.rank||m.rank==F.rank)&&(!F.st||m.status==F.st));
const k={id:'id',name:'name',call:'call',rank:'rank',unit:'unit',st:'status',att:'att',last:'last'}[F.sort]||'id';L.sort((a,b)=>(a[k]>b[k]?1:-1)*F.dir);
const opt=(v,a,l)=>`<select data-f="${v}"><option value="">${l}</option>${a.map(x=>`<option ${F[v]==x?'selected':''}>${x}</option>`).join('')}</select>`;
return `<div class="top"><h1>${t('Members')}</h1><span>${can(3)?`<button class="btn" id="add">+ ${t('Add')}</button> `:''}<button class="btn g" id="ex">${t('Export CSV')}</button></span></div><div class="bar"><input id="q" placeholder="${t('Search')}…" value="${esc(F.q)}">${opt('unit',['Command','Alpha','Bravo','Charlie'],t('Unit'))}${opt('rank',S.ranks.map(r=>r.name),t('Rank'))}${opt('st',['Active','On Leave','Suspended'],t('Status'))}</div>
<div class="card tw"><table><tr>${[['id','ID'],['name','Name'],['call','Callsign'],['rank','Rank'],['unit','Unit'],['st','Status'],['att','Attendance'],['last','Last Activity']].map(h=>`<th data-s="${h[0]}">${t(h[1])}${F.sort==h[0]?(F.dir>0?' ▲':' ▼'):''}</th>`).join('')}<th></th></tr>${L.map(m=>`<tr><td>${m.id}</td><td><span class="av">${esc(m.name.split(' ').map(w=>w[0]).join('').slice(0,2))}</span>${esc(m.name)}</td><td>${esc(m.call)}</td><td>${m.rank}</td><td>${m.unit}</td><td><span class="tag ${m.status.replace(' ','')}">${m.status}</span></td><td>${m.att}%</td><td>${m.last}</td><td><button class="btn g s" data-v="${m.id}">${t('View')}</button>${can(3)?` <button class="btn g s" data-e="${m.id}">${t('Edit')}</button> <button class="btn g s" data-a="${m.id}">${t('Archive')}</button>`:''}</td></tr>`).join('')||`<tr><td colspan=9 class="mu">${t('No results')}</td></tr>`}</table></div>`},
Hierarchy(){const L=live(),kid=id=>L.filter(m=>m.boss==id);const n=m=>`<li><span class="node">${esc(m.name)} <span class="mu">${m.rank}${m.unit?' · '+m.unit:''}</span> ${can(3)?`<button class="btn g s" data-b="${m.id}">↪</button>`:''}</span>${kid(m.id).length?`<ul>${kid(m.id).map(n).join('')}</ul>`:''}</li>`;
return `<h1>${t('Hierarchy')}</h1><br><div class="card tree"><ul style="border:0;padding:0">${L.filter(m=>!m.boss||!L.find(x=>x.id==m.boss)).map(n).join('')}</ul></div><p class="mu">↪ = change reporting line / unit</p>`},
Ranks(){return `<div class="top"><h1>${t('Ranks')}</h1>${can(4)?`<button class="btn" id="addr">+ ${t('Add')}</button>`:''}</div><div class="card tw"><table><tr><th>Insignia</th><th>${t('Name')}</th><th>Abbr</th><th>Level</th><th>Members</th><th>Requirements</th><th>Permissions</th><th></th></tr>${[...S.ranks].sort((a,b)=>b.level-a.level).map(r=>`<tr><td style="color:var(--red)">${r.icon}</td><td>${esc(r.name)}</td><td>${esc(r.abbr)}</td><td>${r.level}</td><td>${live().filter(m=>m.rank==r.name).map(m=>esc(m.name)).join(', ')||'—'}</td><td>${esc(r.req)}</td><td>${esc(r.perms)}</td><td>${can(4)?`<button class="btn g s" data-re="${r.id}">${t('Edit')}</button> <button class="btn g s" data-rd="${r.id}">✕</button>`:''}</td></tr>`).join('')}</table></div>`},
Units(){if(pid){const u=S.units.find(x=>x.id==pid),ms=live().filter(m=>m.unit==u.id);return `<button class="btn g s" id="bk">←</button><div class="top"><h1>${esc(u.name)} — ${esc(u.desig)}</h1>${can(3)?`<button class="btn" id="eu">${t('Edit')}</button>`:''}</div><div class="grid g2"><div class="card"><p>Leader: ${mName(u.leader)}</p><p>Deputy: ${mName(u.dep)}</p><p>Training: <span class="tag">${esc(u.train)}</span></p><p>Activity: ${u.act} sessions</p><p><b>Announcements:</b> ${esc(u.ann)}</p><p><b>Admin notes:</b> ${esc(u.notes)||'—'}</p></div><div class="card"><h3>Members (${ms.length})</h3>${ms.map(m=>`<p>${esc(m.name)} <span class="mu">${m.rank}</span></p>`).join('')||t('No results')}</div></div>`}
return `<h1>${t('Units')}</h1><br><div class="grid">${S.units.map(u=>`<div class="card"><h3>${esc(u.name)}</h3><p class="mu">${live().filter(m=>m.unit==u.id).length} members · ${esc(u.train)}</p><button class="btn" data-u="${u.id}">${t('View')}</button></div>`).join('')}</div>`},
Calendar(){const y=cur.getFullYear(),mo=cur.getMonth(),first=new Date(y,mo,1).getDay(),dim=new Date(y,mo+1,0).getDate();
const head=`<div class="top"><h1>${t('Calendar')}</h1><span><button class="btn g" id="tg">${calv=='cal'?'List':'Calendar'}</button> ${can(2)?`<button class="btn" id="ae">+ ${t('Add')}</button>`:''}</span></div>`;
if(calv=='list')return head+`<div class="card tw"><table><tr><th>${t('Title')}</th><th>${t('Date')}</th><th>${t('Time')}</th><th>Type</th><th>Organizer</th><th>Participants</th><th>${t('Status')}</th><th></th></tr>${[...S.events].sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<tr><td>${esc(e.title)}</td><td>${e.date}</td><td>${e.time}</td><td>${e.type}</td><td>${mName(e.org)}</td><td>${esc(e.people)}</td><td>${e.status}</td><td>${can(2)?`<button class="btn g s" data-ee="${e.id}">${t('Edit')}</button> <button class="btn g s" data-ed="${e.id}">✕</button>`:''}</td></tr>`).join('')||`<tr><td colspan=8>${t('No results')}</td></tr>`}</table></div>`;
let c='';for(let i=0;i<first;i++)c+='<div></div>';for(let d=1;d<=dim;d++){const ds=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;c+=`<div class="day">${d}${S.events.filter(e=>e.date==ds).map(e=>`<div class="ev" data-ee="${e.id}">${esc(e.title)}</div>`).join('')}</div>`}
return head+`<div class="card"><p><button class="btn g s" id="pm">‹</button> <b>${cur.toLocaleString('en',{month:'long',year:'numeric'})}</b> <button class="btn g s" id="nm">›</button></p><div class="cal">${['S','M','T','W','T','F','S'].map(x=>`<b class="mu">${x}</b>`).join('')}${c}</div></div>`},

const rer=()=>render();
const AFT={
Members(){const g=s=>document.querySelectorAll(s);if(pid){$('#bk').onclick=()=>{pid=null;rer()};return}
$('#q').oninput=e=>{F.q=e.target.value;const p=e.target.selectionStart;rer();const q=$('#q');q.focus();q.setSelectionRange(p,p)};g('[data-f]').forEach(s=>s.onchange=()=>{F[s.dataset.f]=s.value;rer()});g('[data-s]').forEach(h=>h.onclick=()=>{F.dir=F.sort==h.dataset.s?-F.dir:1;F.sort=h.dataset.s;rer()});
g('[data-v]').forEach(b=>b.onclick=()=>{pid=b.dataset.v;rer()});
if($('#add'))$('#add').onclick=()=>modal('Add',mf(),{rank:'Recruit',unit:'Alpha',status:'Active',att:80},o=>{const n=Math.max(99,...S.members.map(m=>+m.id.slice(2)))+1;S.members.push({...o,att:Math.min(100,Math.max(0,+o.att)),id:'C-'+n,last:new Date().toISOString().slice(0,10),boss:'',arch:false});log('Added member '+o.name);rer()});
g('[data-e]').forEach(b=>b.onclick=()=>{const m=S.members.find(x=>x.id==b.dataset.e);modal('Edit',mf(),m,o=>{Object.assign(m,o,{att:+o.att});log('Edited member '+m.id);rer()})});
g('[data-a]').forEach(b=>b.onclick=()=>{const m=S.members.find(x=>x.id==b.dataset.a);confirmD('Archive '+m.name+'?',()=>{m.arch=true;log('Archived '+m.id);rer()})});
$('#ex').onclick=()=>csv('members.csv',[['ID','Name','Callsign','Rank','Unit','Status','Attendance','Last Activity'],...live().map(m=>[m.id,m.name,m.call,m.rank,m.unit,m.status,m.att,m.last])])},
Hierarchy(){document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const m=S.members.find(x=>x.id==b.dataset.b);modal('Edit',[['boss','Reports to (member ID, blank = top)','select',['',...live().filter(x=>x.id!=m.id).map(x=>x.id)]],['unit','Unit','select',['Command','Alpha','Bravo','Charlie']]],m,o=>{let p=o.boss;while(p){if(p==m.id){toast('Circular reporting line');return false}p=(S.members.find(x=>x.id==p)||{}).boss}m.boss=o.boss;m.unit=o.unit;log('Hierarchy change '+m.id);rer()})})},
Ranks(){const rf=[['name','Name','text',0,1],['abbr','Abbr','text',0,1],['level','Level','number',0,1],['icon','Insignia'],['req','Promotion requirements'],['perms','Permissions']];
if($('#addr'))$('#addr').onclick=()=>modal('Add',rf,{icon:'★',level:1},o=>{S.ranks.push({...o,level:+o.level,id:'R'+Date.now()});log('Added rank '+o.name);rer()});
document.querySelectorAll('[data-re]').forEach(b=>b.onclick=()=>{const r=S.ranks.find(x=>x.id==b.dataset.re),old=r.name;modal('Edit',rf,r,o=>{Object.assign(r,o,{level:+o.level});S.members.forEach(m=>{if(m.rank==old)m.rank=r.name});log('Edited rank '+r.name);rer()})});
document.querySelectorAll('[data-rd]').forEach(b=>b.onclick=()=>{const r=S.ranks.find(x=>x.id==b.dataset.rd);if(S.members.some(m=>m.rank==r.name&&!m.arch)){toast('Reassign members first');return}confirmD('Delete rank '+r.name+'?',()=>{S.ranks=S.ranks.filter(x=>x!=r);log('Deleted rank '+r.name);rer()})})},
Units(){document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{pid=b.dataset.u;rer()});if(pid){$('#bk').onclick=()=>{pid=null;rer()};if($('#eu'))$('#eu').onclick=()=>{const u=S.units.find(x=>x.id==pid),ids=['',...live().map(m=>m.id)];modal('Edit',[['desig','Designation'],['leader','Leader','select',ids],['dep','Deputy','select',ids],['train','Training status','select',['Certified','In progress','Pending']],['ann','Announcements','area'],['notes','Admin notes','area']],u,o=>{Object.assign(u,o);log('Edited unit '+u.id);rer()})}}},
Calendar(){const g=s=>document.querySelectorAll(s);$('#tg').onclick=()=>{calv=calv=='cal'?'list':'cal';rer()};if($('#pm')){$('#pm').onclick=()=>{cur.setMonth(cur.getMonth()-1);rer()};$('#nm').onclick=()=>{cur.setMonth(cur.getMonth()+1);rer()}}
if($('#ae'))$('#ae').onclick=()=>modal('Add',evf(),{type:'Training',org:'',status:'Scheduled'},o=>{S.events.push({...o,id:Date.now()});log('Added event '+o.title);rer()});
g('[data-ee]').forEach(b=>b.onclick=()=>{const e=S.events.find(x=>x.id==b.dataset.ee);if(!can(2)){toast(e.title+' · '+e.date+' '+e.time);return}modal('Edit',evf(),e,o=>{Object.assign(e,o);log('Edited event '+e.title);rer()})});
g('[data-ed]').forEach(b=>b.onclick=()=>confirmD('Delete event?',()=>{S.events=S.events.filter(x=>x.id!=b.dataset.ed);log('Deleted event');rer()}))},
Reports(){const L=live();$('#r1').onclick=()=>csv('attendance.csv',[['ID','Name','Attendance'],...L.map(m=>[m.id,m.name,m.att])]);$('#r2').onclick=()=>csv('activity.csv',[['Month','Activity'],...S.chart.map((v,i)=>[months[i],v])]);$('#r3').onclick=()=>csv('promotions.csv',[['ID','Name','Rank','History'],...L.map(m=>[m.id,m.name,m.rank,m.promos])]);$('#r4').onclick=()=>csv('audit.csv',[['Time','User','Action'],...S.log.map(l=>[l.d,l.u,l.a])])},
